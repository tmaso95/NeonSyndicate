<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonSyndicate — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: #e0e0f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* Main inventory panel */
  #inv-panel {
    display: flex;
    flex-direction: column;
    width: 820px;
    max-height: 90vh;
    background: rgba(8,8,24,0.95);
    border: 1px solid rgba(255,45,120,0.28);
    backdrop-filter: blur(16px);
    box-shadow: 0 0 60px rgba(0,0,0,0.7), 0 0 30px rgba(255,45,120,0.06);
    animation: panelIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;
    position: relative;
  }
  #inv-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #FF2D78, #9B44FF, transparent);
  }

  /* Header */
  #inv-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,45,120,0.15);
    background: rgba(5,5,16,0.7);
    flex-shrink: 0;
  }
  #inv-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #FF2D78;
    text-shadow: 0 0 8px rgba(255,45,120,0.5);
    flex: 1;
  }
  #weight-bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #weight-label {
    font-size: 11px;
    font-weight: 600;
    color: rgba(224,224,240,0.45);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  #weight-track {
    width: 120px;
    height: 4px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,45,120,0.15);
    position: relative;
  }
  #weight-fill {
    height: 100%;
    background: linear-gradient(90deg, #00FF88, #FFD700, #FF2D78);
    width: 0%;
    transition: width 0.4s ease;
  }
  #weight-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    color: #00D4FF;
    white-space: nowrap;
  }
  #close-btn {
    width: 28px; height: 28px;
    background: rgba(255,45,120,0.1);
    border: 1px solid rgba(255,45,120,0.3);
    color: #FF2D78;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  #close-btn:hover { background: rgba(255,45,120,0.25); }

  /* Body */
  #inv-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left: Grid */
  #inv-left {
    flex: 1;
    padding: 16px;
    border-right: 1px solid rgba(255,45,120,0.12);
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,45,120,0.3) transparent;
  }
  #inv-left::-webkit-scrollbar { width: 3px; }
  #inv-left::-webkit-scrollbar-thumb { background: rgba(255,45,120,0.3); }

  .inv-section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 3px;
    color: rgba(0,212,255,0.6);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  #slot-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }

  .inv-slot {
    width: 100%;
    aspect-ratio: 1;
    background: rgba(5,5,16,0.7);
    border: 1px solid rgba(255,45,120,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
    min-height: 72px;
  }
  .inv-slot:hover { border-color: rgba(255,45,120,0.35); background: rgba(255,45,120,0.04); }
  .inv-slot.drag-over { border-color: #00FF88; background: rgba(0,255,136,0.06); box-shadow: inset 0 0 8px rgba(0,255,136,0.1); }
  .inv-slot.dragging  { opacity: 0.4; border-color: rgba(0,212,255,0.4); }
  .inv-slot.occupied  { border-color: rgba(255,45,120,0.2); }

  .slot-icon { font-size: 22px; line-height: 1; pointer-events: none; }
  .slot-name {
    font-size: 9px;
    font-weight: 600;
    color: rgba(224,224,240,0.55);
    text-align: center;
    margin-top: 2px;
    pointer-events: none;
    letter-spacing: 0.3px;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .slot-qty {
    position: absolute;
    top: 3px; right: 3px;
    background: rgba(255,45,120,0.7);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    font-weight: 700;
    padding: 1px 4px;
    line-height: 1.2;
    pointer-events: none;
  }
  .slot-empty-label {
    font-size: 9px;
    color: rgba(224,224,240,0.1);
    letter-spacing: 1px;
    pointer-events: none;
  }

  /* Right: Silhouette + equipment */
  #inv-right {
    width: 280px;
    flex-shrink: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,45,120,0.3) transparent;
  }

  #silhouette-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #silhouette-figure {
    font-size: 80px;
    line-height: 1;
    filter: drop-shadow(0 0 12px rgba(255,45,120,0.3));
    opacity: 0.7;
  }

  .equip-slots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    width: 100%;
  }

  .equip-slot {
    background: rgba(5,5,16,0.7);
    border: 1px solid rgba(0,212,255,0.15);
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
    min-height: 60px;
    justify-content: center;
  }
  .equip-slot:hover { border-color: rgba(0,212,255,0.4); background: rgba(0,212,255,0.04); }
  .equip-slot.drag-over { border-color: #00FF88; background: rgba(0,255,136,0.06); }
  .equip-slot .slot-icon { font-size: 18px; }
  .equip-slot-label {
    font-size: 8px;
    font-weight: 600;
    color: rgba(0,212,255,0.45);
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
  }
  .equip-slot .slot-name { font-size: 8px; color: rgba(224,224,240,0.45); }

  /* Bag section */
  #bag-section {
    border-top: 1px solid rgba(255,45,120,0.12);
    padding-top: 10px;
  }
  #bag-slot-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #bag-slot {
    flex: 1;
    background: rgba(5,5,16,0.7);
    border: 1px solid rgba(155,68,255,0.2);
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  #bag-slot:hover { border-color: rgba(155,68,255,0.45); }
  #bag-icon { font-size: 20px; }
  #bag-name { font-size: 12px; font-weight: 600; color: rgba(224,224,240,0.6); flex: 1; }
  #unequip-bag-btn {
    padding: 5px 10px;
    font-size: 10px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    background: rgba(155,68,255,0.1);
    border: 1px solid rgba(155,68,255,0.3);
    color: #9B44FF;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  #unequip-bag-btn:hover { background: rgba(155,68,255,0.2); border-color: #9B44FF; }
  #unequip-bag-btn[hidden] { display: none; }

  /* Context menu */
  #ctx-menu {
    position: fixed;
    background: rgba(8,8,24,0.97);
    border: 1px solid rgba(255,45,120,0.3);
    backdrop-filter: blur(8px);
    z-index: 10000;
    min-width: 140px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    display: none;
    flex-direction: column;
  }
  #ctx-menu.visible { display: flex; }
  .ctx-item {
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(224,224,240,0.75);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s, color 0.1s;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .ctx-item:last-child { border-bottom: none; }
  .ctx-item:hover { background: rgba(255,45,120,0.1); color: #FF2D78; }
  .ctx-item.danger:hover { background: rgba(255,45,120,0.15); color: #FF2D78; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: rgba(8,8,24,0.97);
    border: 1px solid rgba(0,212,255,0.25);
    padding: 10px 14px;
    z-index: 9998;
    pointer-events: none;
    display: none;
    max-width: 200px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #tooltip.visible { display: block; }
  #tt-name { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: #00D4FF; margin-bottom: 4px; }
  #tt-type { font-size: 10px; color: rgba(224,224,240,0.4); margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
  #tt-weight { font-size: 11px; color: rgba(224,224,240,0.55); margin-bottom: 4px; }
  #tt-desc { font-size: 11px; color: rgba(224,224,240,0.65); line-height: 1.4; }

  /* Drag ghost */
  #drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 99999;
    opacity: 0.85;
    display: none;
    background: rgba(8,8,24,0.9);
    border: 1px solid rgba(0,212,255,0.5);
    padding: 6px 10px;
    font-size: 20px;
    align-items: center;
    gap: 6px;
    transform: translate(-50%, -50%);
  }
  #drag-ghost.visible { display: flex; }

  @keyframes panelIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
</style>
</head>
<body>
<div class="scanlines"></div>

<!-- Drag Ghost -->
<div id="drag-ghost">
  <span id="ghost-icon"></span><span id="ghost-name" style="font-size:11px;color:#e0e0f0;"></span>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div id="tt-name">Item Name</div>
  <div id="tt-type">type</div>
  <div id="tt-weight">0.0 kg</div>
  <div id="tt-desc">Description here.</div>
</div>

<!-- Context Menu -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-use"  onclick="ctxAction('use')">▶ Foloseste</div>
  <div class="ctx-item" id="ctx-equip" onclick="ctxAction('equip')">⬆ Echipeaza</div>
  <div class="ctx-item" id="ctx-bag"   onclick="ctxAction('bag')">🎒 Equip Bag</div>
  <div class="ctx-item danger" onclick="ctxAction('drop')">🗑 Arunca</div>
</div>

<!-- Inventory Panel -->
<div id="inv-panel">
  <!-- Header -->
  <div id="inv-header">
    <span id="inv-title">INVENTAR</span>
    <div id="weight-bar-wrap">
      <span id="weight-label">GREUTATE</span>
      <div id="weight-track"><div id="weight-fill"></div></div>
      <span id="weight-text">0.0 / 30.0 kg</span>
    </div>
    <button id="close-btn" onclick="doClose()">✕</button>
  </div>

  <!-- Body -->
  <div id="inv-body">

    <!-- Left: Item grid -->
    <div id="inv-left">
      <div class="inv-section-title">Obiecte (30 sloturi)</div>
      <div id="slot-grid"></div>
    </div>

    <!-- Right: Equipment silhouette -->
    <div id="inv-right">
      <div class="inv-section-title">Echipament</div>
      <div id="silhouette-area">
        <div id="silhouette-figure">🧍</div>
        <div class="equip-slots">
          <div class="equip-slot" id="equip-hat"    data-equip="hat">
            <span class="slot-icon">🎩</span>
            <span class="equip-slot-label">Palarie</span>
            <span class="slot-name" id="equip-hat-name">Gol</span>
          </div>
          <div class="equip-slot" id="equip-mask"   data-equip="mask">
            <span class="slot-icon">😷</span>
            <span class="equip-slot-label">Masca</span>
            <span class="slot-name" id="equip-mask-name">Gol</span>
          </div>
          <div class="equip-slot" id="equip-top"    data-equip="top">
            <span class="slot-icon">👕</span>
            <span class="equip-slot-label">Tricou</span>
            <span class="slot-name" id="equip-top-name">Gol</span>
          </div>
          <div class="equip-slot" id="equip-jacket" data-equip="jacket">
            <span class="slot-icon">🧥</span>
            <span class="equip-slot-label">Jacheta</span>
            <span class="slot-name" id="equip-jacket-name">Gol</span>
          </div>
          <div class="equip-slot" id="equip-pants"  data-equip="pants">
            <span class="slot-icon">👖</span>
            <span class="equip-slot-label">Pantaloni</span>
            <span class="slot-name" id="equip-pants-name">Gol</span>
          </div>
          <div class="equip-slot" id="equip-shoes"  data-equip="shoes">
            <span class="slot-icon">👟</span>
            <span class="equip-slot-label">Incaltaminte</span>
            <span class="slot-name" id="equip-shoes-name">Gol</span>
          </div>
        </div>
      </div>

      <!-- Bag -->
      <div id="bag-section">
        <div class="inv-section-title" style="margin-bottom:8px">Geanta / Rucsac</div>
        <div id="bag-slot-wrap">
          <div id="bag-slot">
            <span id="bag-icon">🎒</span>
            <span id="bag-name">Niciun rucsac</span>
          </div>
          <button id="unequip-bag-btn" hidden onclick="unequipBag()">DEZECHIPEAZA</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  /* ── State ── */
  let slots      = new Array(30).fill(null); // { name, icon, qty, type, weight, description, usable }
  let equipped   = {};
  let equippedBag = null;
  let dragFrom   = null; // { type:'grid'|'equip', index/key }
  let ctxSlot    = null;
  let ctxType    = null;

  const ITEM_ICONS = {
    food:'🍔', drink:'💧', weapon:'🔫', armor:'🛡️', clothing:'👕',
    bag:'🎒', drug:'💊', tool:'🔧', key:'🗝️', money:'💵',
    phone:'📱', document:'📄', ammo:'🔴', misc:'📦'
  };

  function getIcon(item) {
    if (item.icon) return item.icon;
    return ITEM_ICONS[item.type] || '📦';
  }

  /* ── Build grid ── */
  function buildGrid() {
    const grid = document.getElementById('slot-grid');
    grid.innerHTML = '';
    for (let i = 0; i < 30; i++) {
      const el = document.createElement('div');
      el.className = 'inv-slot' + (slots[i] ? ' occupied' : '');
      el.dataset.index = i;
      if (slots[i]) {
        const item = slots[i];
        el.innerHTML = `
          <span class="slot-icon">${getIcon(item)}</span>
          <span class="slot-name">${item.name}</span>
          ${item.qty > 1 ? `<span class="slot-qty">${item.qty}</span>` : ''}
        `;
      } else {
        el.innerHTML = `<span class="slot-empty-label">${String(i+1).padStart(2,'0')}</span>`;
      }
      // Drag
      el.addEventListener('mousedown', e => startDrag(e, 'grid', i));
      el.addEventListener('mouseenter', () => onDragEnter(el));
      el.addEventListener('mouseleave', () => el.classList.remove('drag-over'));
      el.addEventListener('mouseup', () => endDrag('grid', i));
      // Context menu
      el.addEventListener('contextmenu', e => { e.preventDefault(); showCtx(e, 'grid', i); });
      // Tooltip
      el.addEventListener('mousemove', e => showTooltip(e, slots[i]));
      el.addEventListener('mouseleave', () => hideTooltip());
      grid.appendChild(el);
    }
  }

  /* ── Drag & Drop ── */
  let ghostEl, ghostActive = false;

  function startDrag(e, type, index) {
    const item = type === 'grid' ? slots[index] : equipped[index];
    if (!item || e.button !== 0) return;
    e.preventDefault();
    dragFrom = { type, index };
    ghostActive = true;
    document.getElementById('ghost-icon').textContent = getIcon(item);
    document.getElementById('ghost-name').textContent = item.name;
    const ghost = document.getElementById('drag-ghost');
    ghost.classList.add('visible');
    ghost.style.left = e.clientX + 'px';
    ghost.style.top  = e.clientY + 'px';
    const slot = type === 'grid' ? document.querySelector(`[data-index="${index}"]`) : null;
    if (slot) slot.classList.add('dragging');
    hideTooltip();
  }

  document.addEventListener('mousemove', e => {
    if (!ghostActive) return;
    const ghost = document.getElementById('drag-ghost');
    ghost.style.left = e.clientX + 'px';
    ghost.style.top  = e.clientY + 'px';
  });

  document.addEventListener('mouseup', e => {
    if (!ghostActive) return;
    ghostActive = false;
    document.getElementById('drag-ghost').classList.remove('visible');
    document.querySelectorAll('.inv-slot.dragging').forEach(el => el.classList.remove('dragging'));
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    dragFrom = null;
  });

  function onDragEnter(el) {
    if (!ghostActive) return;
    document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
    el.classList.add('drag-over');
  }

  function endDrag(type, index) {
    if (!dragFrom || !ghostActive) return;
    if (dragFrom.type === type && dragFrom.index === index) return; // same slot
    if (dragFrom.type === 'grid' && type === 'grid') {
      // Grid to grid
      const fromItem = slots[dragFrom.index];
      const toItem   = slots[index];
      if (fromItem) {
        if (typeof mp !== 'undefined')
          mp.trigger('inventory:browserMove', dragFrom.index, index);
        // Optimistic local swap
        slots[dragFrom.index] = toItem;
        slots[index] = fromItem;
        buildGrid();
      }
    }
  }

  /* ── Context menu ── */
  function showCtx(e, type, index) {
    ctxSlot = index; ctxType = type;
    const item = type === 'grid' ? slots[index] : null;
    if (!item) return;
    const menu = document.getElementById('ctx-menu');
    document.getElementById('ctx-use').style.display   = item.usable  ? '' : 'none';
    document.getElementById('ctx-equip').style.display = item.type === 'clothing' ? '' : 'none';
    document.getElementById('ctx-bag').style.display   = item.type === 'bag' ? '' : 'none';
    menu.style.left = e.clientX + 'px';
    menu.style.top  = e.clientY + 'px';
    menu.classList.add('visible');
  }

  function ctxAction(action) {
    document.getElementById('ctx-menu').classList.remove('visible');
    if (ctxSlot === null) return;
    const item = slots[ctxSlot];
    if (!item) return;
    if (action === 'use')   { if (typeof mp!=='undefined') mp.trigger('inventory:browserUse',  ctxSlot); }
    if (action === 'drop')  { if (typeof mp!=='undefined') mp.trigger('inventory:browserDrop', ctxSlot); slots[ctxSlot] = null; buildGrid(); }
    if (action === 'equip') { if (typeof mp!=='undefined') mp.trigger('inventory:browserEquipBag', ctxSlot); }
    if (action === 'bag')   { if (typeof mp!=='undefined') mp.trigger('inventory:browserEquipBag', ctxSlot); equipBagLocally(item, ctxSlot); }
  }

  function equipBagLocally(item, slotIdx) {
    equippedBag = item;
    slots[slotIdx] = null;
    document.getElementById('bag-icon').textContent = getIcon(item);
    document.getElementById('bag-name').textContent = item.name;
    document.getElementById('unequip-bag-btn').hidden = false;
    buildGrid();
  }

  function unequipBag() {
    if (typeof mp !== 'undefined') mp.trigger('inventory:browserUnequipBag');
    equippedBag = null;
    document.getElementById('bag-icon').textContent = '🎒';
    document.getElementById('bag-name').textContent = 'Niciun rucsac';
    document.getElementById('unequip-bag-btn').hidden = true;
  }

  document.addEventListener('click', () => document.getElementById('ctx-menu').classList.remove('visible'));

  /* ── Tooltip ── */
  function showTooltip(e, item) {
    if (!item || ghostActive) return;
    const tt = document.getElementById('tooltip');
    document.getElementById('tt-name').textContent   = item.name;
    document.getElementById('tt-type').textContent   = item.type || 'misc';
    document.getElementById('tt-weight').textContent = (item.weight || 0) + ' kg';
    document.getElementById('tt-desc').textContent   = item.description || '';
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top  = (e.clientY - 10) + 'px';
    tt.classList.add('visible');
  }
  function hideTooltip() {
    document.getElementById('tooltip').classList.remove('visible');
  }

  /* ── Weight ── */
  function updateWeight() {
    let w = 0;
    slots.forEach(s => { if (s) w += (s.weight || 0) * (s.qty || 1); });
    const max = 30;
    const pct = Math.min(100, (w / max) * 100);
    document.getElementById('weight-fill').style.width = pct + '%';
    document.getElementById('weight-text').textContent = w.toFixed(1) + ' / ' + max + '.0 kg';
  }

  /* ── loadInventory(data) ── */
  function loadInventory(data) {
    // data: { items: [{slot, name, qty, type, weight, description, usable, icon}], equipped: {}, bag: null }
    slots = new Array(30).fill(null);
    if (data.items) {
      data.items.forEach(item => {
        if (item.slot >= 0 && item.slot < 30) slots[item.slot] = item;
      });
    }
    if (data.equipped) {
      equipped = data.equipped;
      Object.keys(equipped).forEach(key => {
        const nameEl = document.getElementById('equip-' + key + '-name');
        const iconEl = document.querySelector(`#equip-${key} .slot-icon`);
        if (nameEl && equipped[key]) { nameEl.textContent = equipped[key].name; }
        if (iconEl && equipped[key]) { iconEl.textContent = getIcon(equipped[key]); }
      });
    }
    if (data.bag) { equipBagLocally(data.bag, -1); }
    buildGrid();
    updateWeight();
  }

  /* ── openTrunk(vin, trunkData) ── */
  function openTrunk(vin, trunkData) {
    document.getElementById('inv-title').textContent = 'PORTBAGAJ — ' + vin;
    loadInventory(trunkData);
  }

  /* ── Close ── */
  function doClose() {
    if (typeof mp !== 'undefined') mp.trigger('inventory:browserClose');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'i' || e.key === 'I' || e.key === 'Escape') doClose();
  });

  /* ── Init ── */
  buildGrid();
</script>
</body>
</html>
