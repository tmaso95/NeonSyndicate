<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonSyndicate — Showroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: #e0e0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* Main panel */
  #showroom-panel {
    width: 860px;
    max-height: 88vh;
    background: rgba(8,8,24,0.95);
    border: 1px solid rgba(255,45,120,0.28);
    backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 30px rgba(255,45,120,0.05);
    animation: panelIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;
    position: relative;
    overflow: hidden;
  }
  #showroom-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #FF2D78, #9B44FF, transparent);
  }

  /* Header */
  #sr-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 22px;
    background: rgba(5,5,16,0.75);
    border-bottom: 1px solid rgba(255,45,120,0.15);
    flex-shrink: 0;
  }
  #sr-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #FF2D78;
    text-shadow: 0 0 10px rgba(255,45,120,0.5);
    flex: 1;
  }
  #sr-cash-display {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: rgba(5,5,16,0.6);
    border: 1px solid rgba(0,212,255,0.2);
  }
  #sr-cash-label { font-size: 10px; color: rgba(0,212,255,0.5); letter-spacing: 2px; text-transform: uppercase; }
  #sr-cash-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #00D4FF;
    text-shadow: 0 0 8px rgba(0,212,255,0.5);
  }
  #sr-close {
    width: 28px; height: 28px;
    background: rgba(255,45,120,0.1);
    border: 1px solid rgba(255,45,120,0.3);
    color: #FF2D78;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  #sr-close:hover { background: rgba(255,45,120,0.25); }

  /* Body */
  #sr-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar: vehicle list */
  #sr-sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid rgba(255,45,120,0.12);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,45,120,0.3) transparent;
    background: rgba(5,5,16,0.5);
  }
  #sr-sidebar::-webkit-scrollbar { width: 3px; }
  #sr-sidebar::-webkit-scrollbar-thumb { background: rgba(255,45,120,0.3); }

  .sr-section-header {
    padding: 8px 14px;
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 3px;
    color: rgba(0,212,255,0.45);
    text-transform: uppercase;
    border-bottom: 1px solid rgba(0,212,255,0.06);
    position: sticky;
    top: 0;
    background: rgba(5,5,16,0.95);
    z-index: 1;
  }

  .sr-vehicle-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: background 0.15s, border-left 0.15s;
    border-left: 2px solid transparent;
  }
  .sr-vehicle-item:hover { background: rgba(255,45,120,0.06); border-left-color: rgba(255,45,120,0.3); }
  .sr-vehicle-item.selected { background: rgba(255,45,120,0.1); border-left-color: #FF2D78; }
  .sr-veh-name { font-size: 13px; font-weight: 700; color: #e0e0f0; }
  .sr-veh-price { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; }
  .sr-veh-price.affordable { color: #00FF88; text-shadow: 0 0 6px rgba(0,255,136,0.4); }
  .sr-veh-price.expensive  { color: #FF4466; text-shadow: 0 0 6px rgba(255,68,102,0.4); }

  /* Main area */
  #sr-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 22px;
    gap: 18px;
    overflow-y: auto;
  }

  /* Car display */
  #car-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(5,5,16,0.6);
    border: 1px solid rgba(255,45,120,0.1);
    min-height: 140px;
    position: relative;
    overflow: hidden;
  }
  #car-display::before {
    content: '';
    position: absolute;
    bottom: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,45,120,0.3), transparent);
  }
  #car-silhouette {
    font-size: 70px;
    line-height: 1;
    filter: drop-shadow(0 0 20px rgba(255,45,120,0.4));
    animation: carFloat 4s ease-in-out infinite;
  }
  @keyframes carFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  #car-glow {
    position: absolute;
    bottom: 10px;
    width: 120px; height: 10px;
    background: rgba(255,45,120,0.25);
    border-radius: 50%;
    filter: blur(6px);
    animation: carFloat 4s ease-in-out infinite;
  }

  /* Info */
  #car-info {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #car-name-big {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
  }
  #car-cat {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(0,212,255,0.6);
    text-transform: uppercase;
  }

  .specs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .spec-card {
    padding: 8px 12px;
    background: rgba(5,5,16,0.6);
    border: 1px solid rgba(255,45,120,0.1);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .spec-label { font-size: 9px; color: rgba(224,224,240,0.35); letter-spacing: 2px; text-transform: uppercase; }
  .spec-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #00D4FF;
    text-shadow: 0 0 6px rgba(0,212,255,0.4);
  }

  /* Price display */
  #price-display {
    padding: 12px 16px;
    background: rgba(5,5,16,0.7);
    border: 1px solid rgba(255,45,120,0.15);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #price-label { font-size: 11px; color: rgba(224,224,240,0.4); letter-spacing: 2px; text-transform: uppercase; flex: 1; }
  #price-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    text-shadow: 0 0 10px currentColor;
  }
  #price-val.affordable { color: #00FF88; }
  #price-val.expensive  { color: #FF4466; }

  /* Colors */
  #color-section { display: flex; flex-direction: column; gap: 10px; }
  .color-section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(224,224,240,0.35);
    text-transform: uppercase;
  }
  #color-pickers-row { display: flex; gap: 12px; align-items: center; }
  .color-pick-group { display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .color-pick-label { font-size: 9px; color: rgba(224,224,240,0.35); letter-spacing: 1px; text-transform: uppercase; }
  .color-swatch {
    width: 40px; height: 40px;
    border: 2px solid rgba(255,45,120,0.3);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
    background: #222;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
  }
  .color-swatch:hover { border-color: #FF2D78; transform: scale(1.1); }

  /* Palette popup */
  #palette-popup {
    position: absolute;
    z-index: 100;
    background: rgba(8,8,24,0.97);
    border: 1px solid rgba(255,45,120,0.3);
    padding: 10px;
    display: none;
    grid-template-columns: repeat(8, 24px);
    gap: 4px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  #palette-popup.visible { display: grid; }
  .palette-color {
    width: 24px; height: 24px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.1s, border-color 0.1s;
  }
  .palette-color:hover { transform: scale(1.2); border-color: #fff; z-index: 1; position: relative; }

  /* Action buttons */
  #action-row { display: flex; gap: 10px; }
  .sr-btn {
    flex: 1;
    padding: 13px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    background: rgba(5,5,16,0.6);
    border: 1px solid rgba(255,45,120,0.25);
    color: rgba(224,224,240,0.6);
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }
  .sr-btn:hover { border-color: rgba(255,45,120,0.6); color: #e0e0f0; background: rgba(255,45,120,0.08); }
  .sr-btn.primary {
    background: linear-gradient(135deg, rgba(255,45,120,0.18), rgba(155,68,255,0.12));
    border-color: rgba(255,45,120,0.5);
    color: #FF2D78;
    text-shadow: 0 0 8px rgba(255,45,120,0.4);
  }
  .sr-btn.primary:hover {
    box-shadow: 0 0 20px rgba(255,45,120,0.2);
    border-color: #FF2D78;
    color: #ff6699;
  }
  .sr-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  @keyframes panelIn {
    from { opacity: 0; transform: scale(0.96) translateY(-20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
</style>
</head>
<body>
<div class="scanlines"></div>

<!-- Palette popup (outside panel so it can overflow) -->
<div id="palette-popup"></div>

<div id="showroom-panel">
  <!-- Header -->
  <div id="sr-header">
    <span id="sr-title">PREMIUM AUTO | TOATE VEHICULELE</span>
    <div id="sr-cash-display">
      <span id="sr-cash-label">CASH</span>
      <span id="sr-cash-val">$0</span>
    </div>
    <button id="sr-close" onclick="doClose()">✕</button>
  </div>

  <div id="sr-body">
    <!-- Sidebar -->
    <div id="sr-sidebar">
      <div class="sr-section-header">Vehicule disponibile</div>
      <div id="vehicle-list"></div>
    </div>

    <!-- Main -->
    <div id="sr-main">
      <!-- Car animation -->
      <div id="car-display">
        <div id="car-silhouette">🏎️</div>
        <div id="car-glow"></div>
      </div>

      <!-- Info -->
      <div id="car-info">
        <div id="car-name-big">Selecteaza un vehicul</div>
        <div id="car-cat">—</div>
        <div class="specs-grid">
          <div class="spec-card">
            <span class="spec-label">Viteza Max</span>
            <span class="spec-val" id="spec-speed">— km/h</span>
          </div>
          <div class="spec-card">
            <span class="spec-label">Acceleratie</span>
            <span class="spec-val" id="spec-accel">—</span>
          </div>
          <div class="spec-card">
            <span class="spec-label">Manevrabilitate</span>
            <span class="spec-val" id="spec-handling">—</span>
          </div>
          <div class="spec-card">
            <span class="spec-label">Tractiune</span>
            <span class="spec-val" id="spec-drive">—</span>
          </div>
        </div>
      </div>

      <!-- Price -->
      <div id="price-display">
        <span id="price-label">PRET VEHICUL</span>
        <span id="price-val" class="affordable">$0</span>
      </div>

      <!-- Colors -->
      <div id="color-section">
        <div class="color-section-title">Culori vehicul</div>
        <div id="color-pickers-row">
          <div class="color-pick-group">
            <span class="color-pick-label">Primar</span>
            <div class="color-swatch" id="color1-swatch" onclick="openPalette(1)"></div>
          </div>
          <div class="color-pick-group">
            <span class="color-pick-label">Secundar</span>
            <div class="color-swatch" id="color2-swatch" onclick="openPalette(2)"></div>
          </div>
          <div style="font-size:11px;color:rgba(224,224,240,0.3);margin-left:8px">
            Apasa pe patrat pentru a alege culoarea
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div id="action-row">
        <button class="sr-btn" id="preview-btn" onclick="doPreview()" disabled>👁 PREVIEW</button>
        <button class="sr-btn primary" id="buy-btn" onclick="doBuy()" disabled>⚡ CUMPARA</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* ── GTA vehicle color palette (64 colors) ── */
  const PALETTE_COLORS = [
    '#000000','#111111','#222222','#333333','#444444','#555555','#777777','#999999',
    '#ffffff','#ff0000','#cc0000','#880000','#ff4444','#ff8888','#ffcccc','#ff6600',
    '#ff9900','#ffcc00','#ffff00','#ccff00','#00ff00','#00cc00','#008800','#004400',
    '#00ffcc','#00ccff','#0088ff','#0044ff','#0000ff','#4400ff','#8800ff','#cc00ff',
    '#ff00ff','#ff0088','#ff0044','#4400aa','#220088','#001166','#002244','#003322',
    '#1a1a00','#331100','#660000','#990000','#003300','#006600','#009900','#00cc33',
    '#00ccaa','#009999','#006699','#003366','#6633ff','#9966ff','#cc99ff','#ff99cc',
    '#ffcc99','#ffff99','#ccffcc','#99ffee','#99eeff','#99ccff','#9999ff','#cc99ff',
  ];

  /* ── State ── */
  let vehicles     = [];
  let selectedIdx  = -1;
  let playerCash   = 0;
  let color1Idx    = 0;
  let color2Idx    = 0;
  let paletteTarget= 1;

  /* ── Build palette popup ── */
  (function buildPalette() {
    const pp = document.getElementById('palette-popup');
    PALETTE_COLORS.forEach((hex, i) => {
      const el = document.createElement('div');
      el.className = 'palette-color';
      el.style.background = hex;
      el.title = hex;
      el.onclick = () => selectColor(i);
      pp.appendChild(el);
    });
  })();

  function openPalette(target) {
    paletteTarget = target;
    const swatch = document.getElementById('color' + target + '-swatch');
    const rect   = swatch.getBoundingClientRect();
    const pp     = document.getElementById('palette-popup');
    pp.style.left = rect.left + 'px';
    pp.style.top  = (rect.bottom + 6) + 'px';
    pp.classList.add('visible');
  }

  function selectColor(idx) {
    if (paletteTarget === 1) {
      color1Idx = idx;
      document.getElementById('color1-swatch').style.background = PALETTE_COLORS[idx];
    } else {
      color2Idx = idx;
      document.getElementById('color2-swatch').style.background = PALETTE_COLORS[idx];
    }
    document.getElementById('palette-popup').classList.remove('visible');
    if (selectedIdx >= 0) {
      const veh = vehicles[selectedIdx];
      if (typeof mp !== 'undefined') mp.trigger('showroom:browserPreview', veh.modelId || veh.model);
    }
  }

  document.addEventListener('click', e => {
    const pp = document.getElementById('palette-popup');
    if (!e.target.classList.contains('color-swatch') && !e.target.classList.contains('palette-color'))
      pp.classList.remove('visible');
  });

  /* ── loadShowroom(data) ── */
  function loadShowroom(data) {
    vehicles   = data.vehicles || [];
    playerCash = data.playerCash || 0;
    if (data.category) document.getElementById('sr-title').textContent = 'PREMIUM AUTO | ' + data.category.toUpperCase();
    document.getElementById('sr-cash-val').textContent = '$' + Number(playerCash).toLocaleString();
    buildVehicleList();
  }

  function buildVehicleList() {
    const list = document.getElementById('vehicle-list');
    list.innerHTML = '';
    vehicles.forEach((veh, i) => {
      const canAfford = playerCash >= veh.price;
      const item = document.createElement('div');
      item.className = 'sr-vehicle-item' + (i === selectedIdx ? ' selected' : '');
      item.innerHTML = `
        <span class="sr-veh-name">${veh.name}</span>
        <span class="sr-veh-price ${canAfford ? 'affordable' : 'expensive'}">$${Number(veh.price).toLocaleString()}</span>
      `;
      item.onclick = () => selectVehicle(i);
      list.appendChild(item);
    });
  }

  function selectVehicle(idx) {
    selectedIdx = idx;
    const veh = vehicles[idx];
    buildVehicleList();

    document.getElementById('car-name-big').textContent = veh.name;
    document.getElementById('car-cat').textContent      = (veh.category || 'Vehicul').toUpperCase();
    document.getElementById('spec-speed').textContent    = veh.topSpeed    ? veh.topSpeed + ' km/h' : '— km/h';
    document.getElementById('spec-accel').textContent    = veh.acceleration ? veh.acceleration + '/10' : '—';
    document.getElementById('spec-handling').textContent = veh.handling     ? veh.handling    + '/10' : '—';
    document.getElementById('spec-drive').textContent    = veh.driveType   || '—';

    const canAfford = playerCash >= veh.price;
    const priceEl   = document.getElementById('price-val');
    priceEl.textContent = '$' + Number(veh.price).toLocaleString();
    priceEl.className   = 'price-val ' + (canAfford ? 'affordable' : 'expensive');

    document.getElementById('preview-btn').disabled = false;
    document.getElementById('buy-btn').disabled = !canAfford;

    // Update car emoji based on category
    const catEmojis = {
      sports:'🏎️', muscle:'🚗', suv:'🚙', truck:'🚛', motorcycle:'🏍️',
      boat:'⛵', helicopter:'🚁', plane:'✈️', sedan:'🚕', van:'🚐'
    };
    const cat = (veh.category || '').toLowerCase();
    document.getElementById('car-silhouette').textContent = catEmojis[cat] || '🚗';
  }

  /* ── previewModel(modelData) ── */
  function previewModel(modelData) {
    // Server can call this to update UI after preview loads
    if (modelData.name) document.getElementById('car-name-big').textContent = modelData.name;
  }

  /* ── Actions ── */
  function doPreview() {
    if (selectedIdx < 0) return;
    const veh = vehicles[selectedIdx];
    if (typeof mp !== 'undefined') mp.trigger('showroom:browserPreview', veh.modelId || veh.model || veh.name);
  }

  function doBuy() {
    if (selectedIdx < 0) return;
    const veh = vehicles[selectedIdx];
    if (typeof mp !== 'undefined') mp.trigger('showroom:browserBuy', veh.modelId || veh.model, color1Idx, color2Idx);
  }

  function doClose() {
    if (typeof mp !== 'undefined') mp.trigger('showroom:browserClose');
  }
</script>
</body>
</html>
