<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonSyndicate — Auth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: #e0e0f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Animated neon grid background */
  #bg {
    position: fixed;
    inset: 0;
    background: #050510;
    overflow: hidden;
    z-index: 0;
  }

  /* Grid lines */
  #bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,45,120,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,45,120,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
  }

  /* Perspective grid floor */
  #bg::after {
    content: '';
    position: absolute;
    bottom: 0; left: -50%;
    width: 200%;
    height: 60%;
    background-image:
      linear-gradient(rgba(0,212,255,0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.07) 1px, transparent 1px);
    background-size: 80px 80px;
    transform: perspective(400px) rotateX(60deg);
    transform-origin: bottom center;
    animation: gridPulse 3s ease-in-out infinite alternate;
  }

  @keyframes gridMove {
    from { background-position: 0 0; }
    to   { background-position: 60px 60px; }
  }
  @keyframes gridPulse {
    from { opacity: 0.6; }
    to   { opacity: 1; }
  }

  /* Glow orbs */
  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
  }
  .orb1 { width: 400px; height: 400px; background: #FF2D78; top: -100px; left: -100px; animation: orbFloat1 8s ease-in-out infinite; }
  .orb2 { width: 300px; height: 300px; background: #00D4FF; bottom: -80px; right: -80px; animation: orbFloat2 10s ease-in-out infinite; }
  .orb3 { width: 200px; height: 200px; background: #9B44FF; top: 50%; right: 20%; animation: orbFloat1 12s ease-in-out infinite reverse; }

  @keyframes orbFloat1 {
    0%,100% { transform: translate(0, 0); }
    50% { transform: translate(30px, 20px); }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0, 0); }
    50% { transform: translate(-20px, -30px); }
  }

  /* Scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* Auth Panel */
  #auth-panel {
    position: relative;
    z-index: 10;
    width: 420px;
    background: rgba(8,8,24,0.92);
    border: 1px solid rgba(255,45,120,0.3);
    backdrop-filter: blur(16px);
    padding: 40px 36px 32px;
    animation: panelIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
    box-shadow: 0 0 40px rgba(255,45,120,0.1), 0 0 80px rgba(0,0,0,0.5);
  }
  #auth-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #FF2D78, #9B44FF, transparent);
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Logo area */
  #auth-logo {
    text-align: center;
    margin-bottom: 8px;
  }
  #auth-logo-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #FF2D78;
    text-shadow: 0 0 10px #FF2D78, 0 0 30px rgba(255,45,120,0.5), 0 0 60px rgba(255,45,120,0.2);
    display: block;
  }
  #auth-subtitle {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    color: rgba(0,212,255,0.7);
    text-transform: uppercase;
    margin-top: 6px;
    display: block;
    text-shadow: 0 0 8px rgba(0,212,255,0.4);
  }

  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,45,120,0.3), transparent);
    margin: 24px 0;
  }

  /* Tabs */
  #tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
    border: 1px solid rgba(255,45,120,0.2);
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: transparent;
    border: none;
    color: rgba(224,224,240,0.4);
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .tab-btn.active {
    color: #FF2D78;
    background: rgba(255,45,120,0.08);
    text-shadow: 0 0 8px rgba(255,45,120,0.6);
  }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: #FF2D78;
    box-shadow: 0 0 8px rgba(255,45,120,0.6);
  }
  .tab-btn:hover:not(.active) { color: rgba(224,224,240,0.7); background: rgba(255,255,255,0.03); }

  /* Forms */
  .auth-form { display: none; flex-direction: column; gap: 14px; }
  .auth-form.active { display: flex; }

  .field-group { display: flex; flex-direction: column; gap: 5px; }
  .field-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(224,224,240,0.45);
  }
  .field-input {
    background: rgba(5,5,16,0.8);
    border: 1px solid rgba(255,45,120,0.2);
    color: #e0e0f0;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
    border-radius: 2px;
  }
  .field-input:focus {
    border-color: #FF2D78;
    box-shadow: 0 0 0 2px rgba(255,45,120,0.12), 0 0 12px rgba(255,45,120,0.08);
  }
  .field-input::placeholder { color: rgba(224,224,240,0.22); }

  /* Buttons */
  .auth-btn {
    margin-top: 6px;
    padding: 13px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, rgba(255,45,120,0.15), rgba(155,68,255,0.1));
    border: 1px solid rgba(255,45,120,0.5);
    color: #FF2D78;
    cursor: pointer;
    transition: all 0.2s ease;
    text-shadow: 0 0 8px rgba(255,45,120,0.5);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .auth-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,45,120,0.2), rgba(155,68,255,0.15));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .auth-btn:hover::before { opacity: 1; }
  .auth-btn:hover {
    border-color: #FF2D78;
    box-shadow: 0 0 20px rgba(255,45,120,0.25), 0 0 40px rgba(255,45,120,0.1);
    color: #ff5599;
  }
  .auth-btn:active { transform: scale(0.98); }

  /* Error display */
  #error-display {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(255,45,120,0.08);
    border: 1px solid rgba(255,45,120,0.35);
    border-left: 3px solid #FF2D78;
    animation: errorIn 0.3s ease forwards;
  }
  #error-display.visible { display: flex; }
  #error-display span { font-size: 13px; font-weight: 600; color: #FF6699; }

  @keyframes errorIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>

<div id="bg">
  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>
  <div class="glow-orb orb3"></div>
</div>
<div class="scanlines"></div>

<div id="auth-panel">
  <div id="auth-logo">
    <span id="auth-logo-text">NEON SYNDICATE</span>
    <span id="auth-subtitle">BLACKRIDGE CITY &nbsp;|&nbsp; HARD RP</span>
  </div>

  <div class="divider"></div>

  <!-- Tabs -->
  <div id="tab-bar">
    <button class="tab-btn active" onclick="switchTab('login')">LOGIN</button>
    <button class="tab-btn" onclick="switchTab('register')">REGISTER</button>
  </div>

  <!-- Login Form -->
  <form class="auth-form active" id="form-login" onsubmit="doLogin(event)">
    <div class="field-group">
      <label class="field-label">Email</label>
      <input class="field-input" id="login-email" type="email" placeholder="user@neonsyndicate.ro" autocomplete="off" required>
    </div>
    <div class="field-group">
      <label class="field-label">Password</label>
      <input class="field-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="off" required>
    </div>
    <div id="error-display">
      <span>⚠</span><span id="error-text">Eroare necunoscuta</span>
    </div>
    <button class="auth-btn" type="submit">CONECTEAZA-TE</button>
  </form>

  <!-- Register Form -->
  <form class="auth-form" id="form-register" onsubmit="doRegister(event)">
    <div class="field-group">
      <label class="field-label">Email</label>
      <input class="field-input" id="reg-email" type="email" placeholder="user@neonsyndicate.ro" autocomplete="off" required>
    </div>
    <div class="field-group">
      <label class="field-label">Password</label>
      <input class="field-input" id="reg-pass" type="password" placeholder="••••••••" autocomplete="off" required>
    </div>
    <div class="field-group">
      <label class="field-label">Confirm Password</label>
      <input class="field-input" id="reg-pass2" type="password" placeholder="••••••••" autocomplete="off" required>
    </div>
    <button class="auth-btn" type="submit">CREEAZA CONT</button>
  </form>
</div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => {
      b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('form-login').classList.toggle('active',    tab === 'login');
    document.getElementById('form-register').classList.toggle('active', tab === 'register');
    clearError();
  }

  function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    if (!email || !pass) { showError('Completeaza toate campurile!'); return; }
    if (typeof mp !== 'undefined') mp.trigger('auth:browserLogin', email, pass);
  }

  function doRegister(e) {
    e.preventDefault();
    const email = document.getElementById('reg-email').value.trim();
    const pass  = document.getElementById('reg-pass').value;
    const pass2 = document.getElementById('reg-pass2').value;
    if (!email || !pass || !pass2) { showError('Completeaza toate campurile!'); return; }
    if (pass !== pass2) { showError('Parolele nu coincid!'); return; }
    if (pass.length < 6) { showError('Parola trebuie sa aiba minim 6 caractere!'); return; }
    if (typeof mp !== 'undefined') mp.trigger('auth:browserRegister', email, pass);
  }

  function showError(msg) {
    const el = document.getElementById('error-display');
    document.getElementById('error-text').textContent = msg;
    el.classList.remove('visible');
    void el.offsetWidth; /* reflow for re-animation */
    el.classList.add('visible');
  }

  function clearError() {
    document.getElementById('error-display').classList.remove('visible');
  }
</script>
</body>
</html>
