<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Phone</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink:   #FF2D78;
    --cyan:   #00D4FF;
    --green:  #00FF88;
    --bg:     #0a0a18;
    --bg2:    #0d0d20;
    --border: rgba(255,45,120,0.3);
    --text:   #e8e8f0;
    --dim:    #5a5a7a;
  }
  body {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 40px;
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
  }

  /* ── Phone shell ── */
  .phone {
    width: 320px; height: 600px;
    background: var(--bg);
    border-radius: 32px;
    border: 2px solid rgba(255,45,120,0.5);
    box-shadow:
      0 0 40px rgba(255,45,120,0.2),
      0 0 80px rgba(255,45,120,0.06),
      inset 0 0 20px rgba(255,45,120,0.03);
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: phoneIn 0.4s cubic-bezier(.16,1,.3,1);
    position: relative;
  }
  @keyframes phoneIn { from{opacity:0;transform:translateY(30px) scale(0.9)} to{opacity:1;transform:none} }

  /* Notch */
  .notch {
    width: 100px; height: 24px;
    background: #050510;
    border-radius: 0 0 16px 16px;
    margin: 0 auto;
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    flex-shrink: 0;
  }
  .notch-dot { width: 8px; height: 8px; border-radius: 50%; background: #1a1a2e; }
  .notch-dot.cam { background: rgba(0,212,255,0.3); box-shadow: 0 0 4px var(--cyan); }

  /* Status bar */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 20px 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem; letter-spacing: 1px; color: var(--dim);
    flex-shrink: 0;
  }
  .status-time { color: var(--text); }
  .status-right { display: flex; gap: 6px; align-items: center; }
  .signal-bar { width: 3px; background: var(--pink); border-radius: 1px; box-shadow: 0 0 4px var(--pink); }

  /* Screen content */
  .screen { flex: 1; overflow: hidden; position: relative; }

  /* ── Home screen ── */
  .home-screen {
    height: 100%; display: flex; flex-direction: column;
    padding: 16px;
  }
  .home-wallpaper {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(255,45,120,0.08), transparent 60%);
  }
  .home-time {
    text-align: center; margin-top: 16px; position: relative; z-index: 1;
  }
  .home-clock {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.4rem; font-weight: 700; letter-spacing: 4px;
    color: var(--text); text-shadow: 0 0 20px rgba(255,45,120,0.3);
  }
  .home-date { font-size: 0.75rem; color: var(--dim); letter-spacing: 3px; margin-top: 4px; }

  /* App grid */
  .app-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; padding: 20px 10px;
    position: relative; z-index: 1;
    margin-top: auto;
  }
  .app {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .app:hover { transform: scale(1.1); }
  .app-icon {
    width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .app:hover .app-icon { border-color: var(--pink); box-shadow: 0 0 12px rgba(255,45,120,0.3); }
  .app-name { font-size: 0.65rem; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
  .app-badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--pink); color: #fff;
    font-family: 'Orbitron', sans-serif; font-size: 0.55rem;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 8px rgba(255,45,120,0.5);
  }

  /* ── SMS Screen ── */
  .sms-screen { height: 100%; display: none; flex-direction: column; }
  .sms-screen.active { display: flex; }

  .screen-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .back-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--pink); font-size: 1rem;
    transition: transform 0.1s;
  }
  .back-btn:hover { transform: translateX(-2px); }
  .screen-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem; letter-spacing: 3px; color: var(--text);
  }

  /* Contacts list */
  .contact-list { flex: 1; overflow-y: auto; }
  .contact-list::-webkit-scrollbar { width: 3px; }
  .contact-list::-webkit-scrollbar-thumb { background: rgba(255,45,120,0.3); }

  .contact-item {
    padding: 12px 16px; cursor: pointer;
    border-bottom: 1px solid rgba(255,45,120,0.08);
    display: flex; align-items: center; gap: 12px;
    transition: background 0.1s;
  }
  .contact-item:hover { background: rgba(255,45,120,0.06); }
  .contact-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,45,120,0.15);
    border: 1px solid rgba(255,45,120,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; color: var(--pink);
    font-family: 'Orbitron', sans-serif;
    flex-shrink: 0;
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 0.85rem; font-weight: 600; }
  .contact-cnp  { font-size: 0.65rem; color: var(--dim); letter-spacing: 1px; }
  .contact-unread { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 6px var(--pink); flex-shrink: 0; }

  /* Conversation */
  .conv-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .conv-messages::-webkit-scrollbar { width: 3px; }
  .conv-messages::-webkit-scrollbar-thumb { background: rgba(255,45,120,0.3); }

  .msg-bubble {
    max-width: 75%; padding: 8px 12px; border-radius: 10px;
    font-size: 0.85rem; line-height: 1.4;
  }
  .msg-bubble.sent {
    align-self: flex-end;
    background: rgba(255,45,120,0.2);
    border: 1px solid rgba(255,45,120,0.3);
    border-bottom-right-radius: 2px;
  }
  .msg-bubble.recv {
    align-self: flex-start;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-bottom-left-radius: 2px;
  }
  .msg-time { font-size: 0.6rem; color: var(--dim); margin-top: 3px; text-align: right; }

  /* Message input */
  .msg-input-row {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px;
    flex-shrink: 0;
  }
  .msg-input {
    flex: 1; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,45,120,0.25);
    border-radius: 20px; padding: 8px 14px;
    color: var(--text); font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem; outline: none;
  }
  .msg-input:focus { border-color: var(--pink); }
  .msg-send {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--pink); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; transition: all 0.15s;
    box-shadow: 0 0 10px rgba(255,45,120,0.4);
    align-self: center;
  }
  .msg-send:hover { transform: scale(1.1); box-shadow: 0 0 16px rgba(255,45,120,0.6); }

  /* Contacts app */
  .add-contact-btn {
    margin: 10px; padding: 8px;
    border: 1px dashed rgba(255,45,120,0.3);
    background: transparent; color: var(--dim);
    cursor: pointer; font-size: 0.75rem; letter-spacing: 2px;
    text-transform: uppercase; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .add-contact-btn:hover { border-color: var(--pink); color: var(--pink); }

  /* Add contact form */
  .add-form { padding: 12px 16px; display: none; flex-direction: column; gap: 8px; }
  .add-form.visible { display: flex; }
  .add-field {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,45,120,0.25);
    padding: 8px 12px; color: var(--text);
    font-family: 'Rajdhani', sans-serif; font-size: 0.9rem;
    outline: none; border-radius: 2px;
  }
  .add-field:focus { border-color: var(--pink); }
  .add-confirm {
    padding: 8px; background: var(--pink); border: none;
    color: #fff; font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem; letter-spacing: 2px; cursor: pointer;
    border-radius: 2px; transition: opacity 0.15s;
  }
  .add-confirm:hover { opacity: 0.85; }

  /* Bottom home bar */
  .home-bar {
    height: 28px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .home-indicator {
    width: 100px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.15);
    cursor: pointer; transition: background 0.15s;
  }
  .home-indicator:hover { background: rgba(255,45,120,0.5); }

  /* Error toast */
  .phone-toast {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    background: rgba(255,68,68,0.9); color: #fff;
    padding: 6px 14px; border-radius: 4px;
    font-size: 0.75rem; white-space: nowrap;
    display: none; animation: toastIn 0.2s ease;
  }
  .phone-toast.visible { display: block; }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(6px)} to{opacity:1;transform:translateX(-50%)} }
</style>
</head>
<body>
<div class="phone">
  <div class="notch">
    <div class="notch-dot cam"></div>
    <div class="notch-dot"></div>
  </div>

  <div class="status-bar">
    <span class="status-time" id="statusTime">00:00</span>
    <div class="status-right">
      <div class="signal-bar" style="height:8px"></div>
      <div class="signal-bar" style="height:6px"></div>
      <div class="signal-bar" style="height:4px"></div>
      <span>📶</span>
    </div>
  </div>

  <div class="screen">
    <!-- HOME -->
    <div id="homeScreen" class="home-screen">
      <div class="home-wallpaper"></div>
      <div class="home-time">
        <div class="home-clock" id="homeClock">00:00</div>
        <div class="home-date" id="homeDate">---</div>
      </div>
      <div class="app-grid">
        <div class="app" onclick="openApp('sms')">
          <div style="position:relative">
            <div class="app-icon" style="background:rgba(255,45,120,0.15)">💬</div>
            <div class="app-badge" id="smsBadge" style="display:none">0</div>
          </div>
          <span class="app-name">Mesaje</span>
        </div>
        <div class="app" onclick="openApp('contacts')">
          <div class="app-icon" style="background:rgba(0,212,255,0.12)">👥</div>
          <span class="app-name">Contacte</span>
        </div>
        <div class="app" onclick="openApp('bank')">
          <div class="app-icon" style="background:rgba(0,255,136,0.1)">🏦</div>
          <span class="app-name">Banca</span>
        </div>
        <div class="app" onclick="openApp('map')">
          <div class="app-icon" style="background:rgba(155,68,255,0.15)">🗺️</div>
          <span class="app-name">Harta</span>
        </div>
        <div class="app" onclick="openApp('gang')">
          <div class="app-icon" style="background:rgba(255,45,120,0.1)">⚡</div>
          <span class="app-name">Org.</span>
        </div>
        <div class="app" onclick="closePhone()">
          <div class="app-icon" style="background:rgba(255,100,0,0.12)">🔒</div>
          <span class="app-name">Inchide</span>
        </div>
      </div>
    </div>

    <!-- SMS / MESSAGES -->
    <div id="smsScreen" class="sms-screen" style="display:none">
      <div id="smsConvList" style="height:100%;display:flex;flex-direction:column">
        <div class="screen-header">
          <div class="back-btn" onclick="openApp('home')">←</div>
          <div class="screen-title">Mesaje</div>
        </div>
        <div class="contact-list" id="msgContactList"></div>
      </div>

      <div id="convView" style="height:100%;display:none;flex-direction:column">
        <div class="screen-header">
          <div class="back-btn" onclick="showElement('smsConvList');hideElement('convView')">←</div>
          <div class="screen-title" id="convTitle">---</div>
        </div>
        <div class="conv-messages" id="convMessages"></div>
        <div class="msg-input-row">
          <input type="text" class="msg-input" id="msgInput" placeholder="Scrie un mesaj..." maxlength="512">
          <button class="msg-send" onclick="sendSMS()">➤</button>
        </div>
      </div>
    </div>

    <!-- CONTACTS -->
    <div id="contactsScreen" style="height:100%;display:none;flex-direction:column">
      <div class="screen-header">
        <div class="back-btn" onclick="openApp('home')">←</div>
        <div class="screen-title">Contacte</div>
      </div>
      <div class="contact-list" id="contactList"></div>
      <button class="add-contact-btn" onclick="toggleAddForm()">+ Adauga Contact</button>
      <div class="add-form" id="addForm">
        <input type="text" class="add-field" id="addCnp"  placeholder="CNP Tinta" maxlength="8">
        <input type="text" class="add-field" id="addName" placeholder="Nume Afisat" maxlength="32">
        <button class="add-confirm" onclick="addContact()">Salveaza</button>
      </div>
    </div>

    <!-- Placeholder screens -->
    <div id="bankScreen"  style="height:100%;display:none;flex-direction:column">
      <div class="screen-header">
        <div class="back-btn" onclick="openApp('home')">←</div>
        <div class="screen-title">Banca</div>
      </div>
      <div style="padding:30px;text-align:center;color:var(--dim);font-size:0.9rem">Acceseaza un ATM sau sucursala bancara.</div>
    </div>
    <div id="mapScreen"   style="height:100%;display:none;flex-direction:column">
      <div class="screen-header">
        <div class="back-btn" onclick="openApp('home')">←</div>
        <div class="screen-title">Harta</div>
      </div>
      <div style="padding:30px;text-align:center;color:var(--dim);font-size:0.9rem">Foloseste minimap-ul in joc.</div>
    </div>
    <div id="gangScreen"  style="height:100%;display:none;flex-direction:column">
      <div class="screen-header">
        <div class="back-btn" onclick="openApp('home')">←</div>
        <div class="screen-title">Organizatie</div>
      </div>
      <div style="padding:30px;text-align:center;color:var(--dim);font-size:0.9rem">Nu esti intr-o organizatie.</div>
    </div>
  </div>

  <div class="home-bar">
    <div class="home-indicator" onclick="openApp('home')"></div>
  </div>

  <div class="phone-toast" id="phoneToast"></div>
</div>

<script>
  let phoneData    = null;
  let openConvCnp  = null;
  const SCREENS    = ['home','sms','contacts','bank','map','gang'];

  // ── Clock ──
  function tick() {
    const now  = new Date();
    const time = now.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});
    const date = now.toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long'});
    document.getElementById('homeClock').textContent = time;
    document.getElementById('homeDate').textContent  = date;
    document.getElementById('statusTime').textContent = time;
  }
  setInterval(tick, 1000); tick();

  function initPhone(data) {
    phoneData = data;
    renderContacts(data.contacts || []);
    const badge = document.getElementById('smsBadge');
    if (data.unread > 0) {
      badge.textContent  = data.unread;
      badge.style.display = 'flex';
    }
  }

  function openApp(app) {
    SCREENS.forEach(s => {
      const el = document.getElementById(s + 'Screen');
      if (el) el.style.display = 'none';
    });
    const target = document.getElementById(app + 'Screen');
    if (target) { target.style.display = 'flex'; }
    else { document.getElementById('homeScreen').style.display = 'flex'; }
  }

  function showElement(id) { document.getElementById(id).style.display = 'flex'; }
  function hideElement(id) { document.getElementById(id).style.display = 'none'; }

  // ── Contacts ──
  function renderContacts(contacts) {
    const list = document.getElementById('contactList');
    const msgList = document.getElementById('msgContactList');
    list.innerHTML = '';
    msgList.innerHTML = '';

    contacts.forEach(c => {
      const initial = c.contact_name ? c.contact_name[0].toUpperCase() : '?';

      const el1 = contactEl(c, initial, () => openConversation(c));
      const el2 = contactEl(c, initial, () => openConversation(c));

      list.appendChild(el1);
      msgList.appendChild(el2);
    });
  }

  function contactEl(c, initial, onclick) {
    const el = document.createElement('div');
    el.className = 'contact-item';
    el.innerHTML = `
      <div class="contact-avatar">${initial}</div>
      <div class="contact-info">
        <div class="contact-name">${c.contact_name}</div>
        <div class="contact-cnp">CNP: ${c.contact_cnp}</div>
      </div>`;
    el.onclick = onclick;
    return el;
  }

  function openConversation(contact) {
    openConvCnp = contact.contact_cnp;
    document.getElementById('convTitle').textContent = contact.contact_name;
    hideElement('smsConvList');
    showElement('convView');
    mp.trigger('phone:browserGetConv', contact.contact_cnp);
  }

  function loadConversation(data) {
    const cont = document.getElementById('convMessages');
    cont.innerHTML = '';
    data.messages.forEach(m => {
      const isSent = m.sender_cnp === (phoneData ? phoneData.cnp : '');
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isSent ? 'sent' : 'recv'}`;
      const t = new Date(m.sent_at).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});
      bubble.innerHTML = `${m.message}<div class="msg-time">${t}</div>`;
      cont.appendChild(bubble);
    });
    cont.scrollTop = cont.scrollHeight;
  }

  function sendSMS() {
    if (!openConvCnp) return;
    const input = document.getElementById('msgInput');
    const msg   = input.value.trim();
    if (!msg) return;
    mp.trigger('phone:browserSendSMS', openConvCnp, msg);
    input.value = '';
  }

  function smsSent() {
    if (openConvCnp) mp.trigger('phone:browserGetConv', openConvCnp);
  }

  function receiveSMS(data) {
    const badge = document.getElementById('smsBadge');
    const cur   = parseInt(badge.textContent || '0') + 1;
    badge.textContent  = cur;
    badge.style.display = 'flex';
    if (openConvCnp === data.from) {
      mp.trigger('phone:browserGetConv', data.from);
    }
  }

  // ── Add Contact ──
  function toggleAddForm() {
    const f = document.getElementById('addForm');
    f.classList.toggle('visible');
  }

  function addContact() {
    const cnp  = document.getElementById('addCnp').value.trim();
    const name = document.getElementById('addName').value.trim();
    if (!cnp || !name) return phoneError('Completeaza toate campurile.');
    mp.trigger('phone:browserAddContact', cnp, name);
  }

  function contactAdded(contact) {
    document.getElementById('addForm').classList.remove('visible');
    document.getElementById('addCnp').value  = '';
    document.getElementById('addName').value = '';
    if (phoneData) {
      phoneData.contacts.push({ contact_cnp: contact.cnp, contact_name: contact.name });
      renderContacts(phoneData.contacts);
    }
  }

  function contactDeleted(cnp) {
    if (phoneData) {
      phoneData.contacts = phoneData.contacts.filter(c => c.contact_cnp !== cnp);
      renderContacts(phoneData.contacts);
    }
  }

  function phoneError(msg) {
    const t = document.getElementById('phoneToast');
    t.textContent = msg;
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 3000);
  }

  function closePhone() {
    mp.trigger('phone:browserClose');
  }

  // Enter sends SMS
  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendSMS();
  });
</script>
</body>
</html>
