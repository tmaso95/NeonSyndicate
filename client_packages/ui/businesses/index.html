<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonSyndicate — Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: #e0e0f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* Main panel */
  #shop-panel {
    width: 780px;
    max-height: 88vh;
    background: rgba(8,8,24,0.95);
    border: 1px solid rgba(255,45,120,0.28);
    backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    animation: panelIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;
    position: relative;
    overflow: hidden;
  }
  #shop-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #FF2D78, #9B44FF, transparent);
  }

  /* Header */
  #shop-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px;
    background: rgba(5,5,16,0.8);
    border-bottom: 1px solid rgba(255,45,120,0.15);
    flex-shrink: 0;
  }
  #shop-icon { font-size: 22px; }
  #shop-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #FF2D78;
    text-shadow: 0 0 10px rgba(255,45,120,0.5);
    flex: 1;
  }
  #shop-type {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(0,212,255,0.55);
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid rgba(0,212,255,0.18);
    background: rgba(0,212,255,0.04);
  }
  #shop-cash-display {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(5,5,16,0.6);
    border: 1px solid rgba(0,212,255,0.18);
  }
  #shop-cash-label { font-size: 9px; color: rgba(0,212,255,0.45); letter-spacing: 2px; text-transform: uppercase; }
  #shop-cash-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #00D4FF;
    text-shadow: 0 0 6px rgba(0,212,255,0.5);
  }
  #shop-close {
    width: 28px; height: 28px;
    background: rgba(255,45,120,0.1);
    border: 1px solid rgba(255,45,120,0.3);
    color: #FF2D78;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  #shop-close:hover { background: rgba(255,45,120,0.25); }

  /* Body */
  #shop-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left: Item grid */
  #shop-left {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,45,120,0.3) transparent;
    border-right: 1px solid rgba(255,45,120,0.1);
  }
  #shop-left::-webkit-scrollbar { width: 3px; }
  #shop-left::-webkit-scrollbar-thumb { background: rgba(255,45,120,0.3); }

  #item-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .shop-item-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 12px 8px;
    background: rgba(5,5,16,0.65);
    border: 1px solid rgba(255,45,120,0.1);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    position: relative;
    text-align: center;
  }
  .shop-item-card:hover { border-color: rgba(255,45,120,0.35); background: rgba(255,45,120,0.05); }
  .shop-item-card.selected { border-color: #FF2D78; background: rgba(255,45,120,0.1); box-shadow: 0 0 10px rgba(255,45,120,0.1); }
  .shop-item-card:active { transform: scale(0.97); }

  .shop-item-icon { font-size: 28px; line-height: 1; }
  .shop-item-name { font-size: 11px; font-weight: 700; color: #e0e0f0; letter-spacing: 0.3px; }
  .shop-item-price {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #00FF88;
    text-shadow: 0 0 6px rgba(0,255,136,0.4);
  }
  .shop-item-price.expensive { color: #FF4466; text-shadow: 0 0 6px rgba(255,68,102,0.4); }
  .stock-badge {
    position: absolute;
    top: 4px; right: 4px;
    background: rgba(0,212,255,0.15);
    border: 1px solid rgba(0,212,255,0.3);
    color: #00D4FF;
    font-family: 'Orbitron', sans-serif;
    font-size: 7px;
    font-weight: 700;
    padding: 1px 4px;
  }
  .stock-badge.out { background: rgba(255,45,120,0.1); border-color: rgba(255,45,120,0.3); color: #FF2D78; }

  /* Right: Detail panel */
  #shop-right {
    width: 260px;
    flex-shrink: 0;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: rgba(5,5,16,0.5);
  }

  #item-detail {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
  }

  #detail-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 10px;
    color: rgba(224,224,240,0.2);
  }
  #detail-placeholder-icon { font-size: 36px; opacity: 0.25; }
  #detail-placeholder-msg  { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; }

  #detail-content { display: none; flex-direction: column; gap: 12px; }
  #detail-content.visible { display: flex; }

  #detail-icon { font-size: 52px; text-align: center; line-height: 1; }
  #detail-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-align: center;
  }
  #detail-type {
    font-size: 10px;
    color: rgba(0,212,255,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }
  #detail-desc {
    font-size: 12px;
    color: rgba(224,224,240,0.55);
    line-height: 1.6;
    padding: 8px 10px;
    background: rgba(5,5,16,0.5);
    border-left: 2px solid rgba(255,45,120,0.25);
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .detail-row-label { font-size: 11px; color: rgba(224,224,240,0.35); letter-spacing: 1px; text-transform: uppercase; }
  .detail-row-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: #00D4FF;
  }
  #detail-price-big {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    text-align: center;
    text-shadow: 0 0 10px currentColor;
  }
  #detail-price-big.affordable { color: #00FF88; }
  #detail-price-big.expensive  { color: #FF4466; }

  /* Quantity selector */
  #qty-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .qty-label { font-size: 10px; color: rgba(224,224,240,0.35); letter-spacing: 2px; text-transform: uppercase; }
  #qty-row {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid rgba(255,45,120,0.2);
  }
  .qty-btn {
    width: 36px; height: 36px;
    background: rgba(255,45,120,0.08);
    border: none;
    color: #FF2D78;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .qty-btn:hover { background: rgba(255,45,120,0.2); }
  #qty-val {
    flex: 1;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: transparent;
    border: none;
    outline: none;
    padding: 8px;
  }
  #qty-total {
    font-size: 11px;
    color: rgba(224,224,240,0.35);
    text-align: center;
  }
  #qty-total span {
    font-family: 'Orbitron', sans-serif;
    color: #00D4FF;
    font-weight: 700;
  }

  /* Buy button */
  #buy-btn {
    padding: 13px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(135deg, rgba(255,45,120,0.18), rgba(155,68,255,0.12));
    border: 1px solid rgba(255,45,120,0.45);
    color: #FF2D78;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 8px rgba(255,45,120,0.4);
    border-radius: 2px;
    text-transform: uppercase;
  }
  #buy-btn:hover {
    border-color: #FF2D78;
    box-shadow: 0 0 20px rgba(255,45,120,0.2);
    color: #ff6699;
  }
  #buy-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #buy-btn:active:not(:disabled) { transform: scale(0.98); }

  /* Toast notifications */
  #toast-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10000;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  .toast {
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 600;
    border-left: 3px solid;
    backdrop-filter: blur(8px);
    background: rgba(8,8,24,0.95);
    min-width: 280px;
    text-align: center;
    animation: toastIn 0.35s ease forwards;
  }
  .toast.success { border-color: #00FF88; color: #00FF88; }
  .toast.error   { border-color: #FF2D78; color: #FF4466; }
  .toast.out { animation: toastOut 0.3s ease forwards; }

  @keyframes panelIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes toastIn  { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes toastOut { to   { opacity:0; transform:translateY(-12px); max-height:0; padding:0; margin:0; } }
</style>
</head>
<body>
<div class="scanlines"></div>

<!-- Toast -->
<div id="toast-container"></div>

<div id="shop-panel">
  <!-- Header -->
  <div id="shop-header">
    <span id="shop-icon">🏪</span>
    <span id="shop-name">MAGAZIN</span>
    <span id="shop-type">GENERAL</span>
    <div id="shop-cash-display">
      <span id="shop-cash-label">CASH</span>
      <span id="shop-cash-val">$0</span>
    </div>
    <button id="shop-close" onclick="doClose()">✕</button>
  </div>

  <div id="shop-body">
    <!-- Item Grid -->
    <div id="shop-left">
      <div id="item-grid"></div>
    </div>

    <!-- Detail -->
    <div id="shop-right">
      <div id="item-detail">
        <!-- Placeholder -->
        <div id="detail-placeholder">
          <div id="detail-placeholder-icon">🛒</div>
          <div id="detail-placeholder-msg">Selecteaza un produs</div>
        </div>

        <!-- Content -->
        <div id="detail-content">
          <div id="detail-icon">📦</div>
          <div id="detail-name">Item Name</div>
          <div id="detail-type">misc</div>
          <div id="detail-desc">Descriere produs.</div>
          <div class="detail-row">
            <span class="detail-row-label">Stoc</span>
            <span class="detail-row-val" id="detail-stock">0</span>
          </div>
          <div class="detail-row">
            <span class="detail-row-label">Greutate</span>
            <span class="detail-row-val" id="detail-weight">0 kg</span>
          </div>
          <div id="detail-price-big" class="affordable">$0</div>

          <div id="qty-section">
            <div class="qty-label">Cantitate</div>
            <div id="qty-row">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <input id="qty-val" type="number" min="1" max="10" value="1" readonly>
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <div id="qty-total">Total: <span id="total-val">$0</span></div>
          </div>

          <button id="buy-btn" onclick="doBuy()" disabled>⚡ CUMPARA</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  /* ── State ── */
  let shopData     = null;
  let selectedItem = null;
  let playerCash   = 0;
  let qty          = 1;

  const ITEM_ICONS = {
    food:'🍔', drink:'💧', weapon:'🔫', armor:'🛡️', clothing:'👕',
    bag:'🎒', drug:'💊', tool:'🔧', key:'🗝️', money:'💵',
    phone:'📱', document:'📄', ammo:'🔴', misc:'📦', medical:'💊',
    electronic:'💾', alcohol:'🍺', cigarette:'🚬', fish:'🐟', wood:'🪵'
  };

  const TYPE_ICONS = {
    grocery:'🏪', weapons:'🔫', pharmacy:'💊', electronics:'📱',
    clothing:'👕', mechanic:'🔧', general:'🏪'
  };

  function getIcon(item) {
    if (item.icon) return item.icon;
    return ITEM_ICONS[item.type] || ITEM_ICONS[item.category] || '📦';
  }

  /* ── loadShop(data) ── */
  function loadShop(data) {
    shopData   = data;
    playerCash = data.playerCash || data.cash || 0;
    document.getElementById('shop-cash-val').textContent = '$' + Number(playerCash).toLocaleString();

    if (data.business) {
      const biz = data.business;
      document.getElementById('shop-name').textContent = (biz.name || 'MAGAZIN').toUpperCase();
      document.getElementById('shop-type').textContent = (biz.type || 'GENERAL').toUpperCase();
      document.getElementById('shop-icon').textContent = TYPE_ICONS[(biz.type||'').toLowerCase()] || '🏪';
    }

    buildItemGrid(data.stock || []);
    // Reset detail
    selectedItem = null;
    document.getElementById('detail-placeholder').style.display = 'flex';
    document.getElementById('detail-content').classList.remove('visible');
  }

  function buildItemGrid(stock) {
    const grid = document.getElementById('item-grid');
    grid.innerHTML = '';
    stock.forEach(item => {
      const canAfford = playerCash >= item.price;
      const outOfStock = (item.stock !== undefined && item.stock <= 0);
      const card = document.createElement('div');
      card.className = 'shop-item-card' + (outOfStock ? ' out-of-stock' : '');
      card.innerHTML = `
        <span class="stock-badge ${outOfStock ? 'out' : ''}">${outOfStock ? 'EPUIZAT' : item.stock !== undefined ? item.stock : '∞'}</span>
        <span class="shop-item-icon">${getIcon(item)}</span>
        <span class="shop-item-name">${item.displayName || item.name}</span>
        <span class="shop-item-price ${canAfford ? 'affordable' : 'expensive'}">$${Number(item.price).toLocaleString()}</span>
      `;
      card.onclick = () => selectItem(item, card);
      grid.appendChild(card);
    });
    if (!stock.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;font-size:13px;color:rgba(224,224,240,0.2)">Stoc epuizat</div>';
    }
  }

  /* ── Select item ── */
  function selectItem(item, cardEl) {
    selectedItem = item;
    qty = 1;
    document.getElementById('qty-val').value = 1;

    document.querySelectorAll('.shop-item-card').forEach(c => c.classList.remove('selected'));
    cardEl.classList.add('selected');

    document.getElementById('detail-placeholder').style.display = 'none';
    document.getElementById('detail-content').classList.add('visible');

    document.getElementById('detail-icon').textContent    = getIcon(item);
    document.getElementById('detail-name').textContent    = item.displayName || item.name;
    document.getElementById('detail-type').textContent    = (item.type || 'misc').toUpperCase();
    document.getElementById('detail-desc').textContent    = item.description || 'Nicio descriere disponibila.';
    document.getElementById('detail-stock').textContent   = item.stock !== undefined ? item.stock : '∞';
    document.getElementById('detail-weight').textContent  = (item.weight || 0) + ' kg';

    updatePriceDisplay();
  }

  function updatePriceDisplay() {
    if (!selectedItem) return;
    const price      = selectedItem.price || 0;
    const total      = price * qty;
    const canAfford  = playerCash >= total;
    const outOfStock = (selectedItem.stock !== undefined && selectedItem.stock <= 0);

    const priceEl = document.getElementById('detail-price-big');
    priceEl.textContent = '$' + Number(price).toLocaleString();
    priceEl.className   = 'detail-price-big ' + (canAfford ? 'affordable' : 'expensive');

    document.getElementById('total-val').textContent = '$' + Number(total).toLocaleString();

    const buyBtn = document.getElementById('buy-btn');
    buyBtn.disabled = !canAfford || outOfStock;
    buyBtn.textContent = outOfStock ? '❌ STOC EPUIZAT' : '⚡ CUMPARA';
  }

  function changeQty(delta) {
    const max = selectedItem && selectedItem.stock !== undefined
      ? Math.min(10, selectedItem.stock)
      : 10;
    qty = Math.max(1, Math.min(max, qty + delta));
    document.getElementById('qty-val').value = qty;
    updatePriceDisplay();
  }

  /* ── Buy ── */
  function doBuy() {
    if (!selectedItem || !shopData || !shopData.business) return;
    const outOfStock = (selectedItem.stock !== undefined && selectedItem.stock <= 0);
    const total      = (selectedItem.price || 0) * qty;
    if (outOfStock || playerCash < total) return;

    if (typeof mp !== 'undefined')
      mp.trigger('shop:browserBuy', shopData.business.id, selectedItem.name, qty);

    showToast('Cumparare trimisa!', 'success');
  }

  /* ── Toast ── */
  function showToast(msg, type) {
    const cont = document.getElementById('toast-container');
    const el   = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    cont.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    }, 3000);
  }

  /* ── Close ── */
  function doClose() {
    if (typeof mp !== 'undefined') mp.trigger('shop:browserClose');
  }
</script>
</body>
</html>
