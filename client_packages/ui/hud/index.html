<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink:   #FF2D78;
    --cyan:   #00D4FF;
    --green:  #00FF88;
    --yellow: #FFD700;
    --red:    #FF4444;
    --text:   #e8e8f0;
    --dim:    #6a6a8a;
  }
  body {
    background: transparent;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    width: 100vw; height: 100vh;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
  }

  /* ── Bottom-right vitals ── */
  .vitals {
    position: fixed;
    bottom: 28px; right: 28px;
    display: flex; flex-direction: column; gap: 6px;
    align-items: flex-end;
  }

  .bar-row {
    display: flex; align-items: center; gap: 10px;
  }
  .bar-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem; letter-spacing: 2px;
    color: var(--dim); text-transform: uppercase;
    width: 16px; text-align: right;
  }
  .bar-track {
    width: 180px; height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.4s ease;
    position: relative;
  }
  .bar-fill::after {
    content: ''; position: absolute;
    top: 0; right: 0; bottom: 0; width: 3px;
    background: rgba(255,255,255,0.6);
    border-radius: 0 3px 3px 0;
  }
  .bar-hp   .bar-fill { background: linear-gradient(90deg, #d42b2b, #ff4444); box-shadow: 0 0 8px rgba(255,68,68,0.4); }
  .bar-armor .bar-fill { background: linear-gradient(90deg, #1a7ab5, var(--cyan)); box-shadow: 0 0 8px rgba(0,212,255,0.3); }
  .bar-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem; color: var(--text);
    width: 28px; text-align: left;
  }

  /* ── Cash display ── */
  .cash-display {
    position: fixed;
    bottom: 28px; left: 28px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .cash-item {
    display: flex; align-items: center; gap: 8px;
    background: rgba(5,5,16,0.75);
    padding: 6px 12px;
    border-left: 2px solid var(--pink);
  }
  .cash-icon { font-size: 0.75rem; color: var(--pink); }
  .cash-amount {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem; color: var(--text);
  }
  .cash-label { font-size: 0.6rem; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .cash-item.bank { border-left-color: var(--cyan); }
  .cash-item.bank .cash-icon { color: var(--cyan); }

  /* ── Top-left player info ── */
  .player-info {
    position: fixed;
    top: 20px; left: 20px;
    background: rgba(5,5,16,0.8);
    border: 1px solid rgba(255,45,120,0.3);
    border-left: 3px solid var(--pink);
    padding: 10px 16px;
    min-width: 200px;
    box-shadow: 4px 0 20px rgba(255,45,120,0.1);
  }
  .player-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem; letter-spacing: 2px;
    color: var(--text); text-transform: uppercase;
  }
  .player-meta {
    display: flex; gap: 12px; margin-top: 4px;
  }
  .player-meta-item {
    display: flex; align-items: center; gap: 4px;
    font-size: 0.7rem; color: var(--dim);
  }
  .player-meta-item span { color: var(--pink); font-family: 'Orbitron', sans-serif; font-size: 0.65rem; }
  .player-job { margin-top: 4px; font-size: 0.7rem; color: var(--cyan); letter-spacing: 1px; }

  /* ── Speed display (in vehicle) ── */
  .speed-display {
    position: fixed;
    bottom: 100px; right: 28px;
    display: none;
    align-items: baseline; gap: 4px;
  }
  .speed-display.visible { display: flex; }
  .speed-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.5rem; font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(0,212,255,0.5);
    line-height: 1;
  }
  .speed-unit { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--dim); letter-spacing: 2px; }

  /* ── Clock ── */
  .clock {
    position: fixed;
    top: 20px; right: 20px;
    background: rgba(5,5,16,0.8);
    border: 1px solid rgba(255,45,120,0.2);
    padding: 8px 14px; text-align: right;
  }
  .clock-time {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem; color: var(--text);
    letter-spacing: 3px;
  }
  .clock-date { font-size: 0.65rem; color: var(--dim); letter-spacing: 2px; margin-top: 2px; }

  /* ── Notifications ── */
  .notifications {
    position: fixed;
    top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
    z-index: 100;
  }
  .notif {
    background: rgba(5,5,16,0.95);
    border-left: 3px solid var(--cyan);
    padding: 10px 18px;
    font-size: 0.9rem; letter-spacing: 0.5px;
    min-width: 280px; max-width: 420px;
    animation: notifIn 0.3s cubic-bezier(.16,1,.3,1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .notif.success { border-left-color: var(--green); }
  .notif.error   { border-left-color: var(--red); }
  .notif.warning { border-left-color: var(--yellow); }
  .notif.info    { border-left-color: var(--cyan); }
  .notif.out     { animation: notifOut 0.3s ease forwards; }
  @keyframes notifIn  { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:none} }
  @keyframes notifOut { to{opacity:0;transform:translateY(-10px)} }

  /* ── Level bar ── */
  .level-bar {
    position: fixed;
    top: 72px; left: 20px;
    width: 200px;
  }
  .level-info { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .level-label { font-size: 0.65rem; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
  .level-num { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--pink); }
  .level-track { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .level-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--neon-purple, #9B44FF), var(--pink));
    box-shadow: 0 0 8px rgba(255,45,120,0.4);
    transition: width 0.8s cubic-bezier(.16,1,.3,1);
    width: 0%;
  }
</style>
</head>
<body>

<!-- Player Info -->
<div class="player-info" id="playerInfo">
  <div class="player-name" id="playerName">---</div>
  <div class="player-meta">
    <div class="player-meta-item">CNP: <span id="playerCnp">---</span></div>
  </div>
  <div class="player-job" id="playerJob">Somer</div>
</div>

<!-- Level Bar -->
<div class="level-bar">
  <div class="level-info">
    <span class="level-label">Nivel</span>
    <span class="level-num" id="levelNum">1</span>
  </div>
  <div class="level-track"><div class="level-fill" id="levelFill"></div></div>
</div>

<!-- Clock -->
<div class="clock">
  <div class="clock-time" id="clockTime">00:00</div>
  <div class="clock-date" id="clockDate">---</div>
</div>

<!-- Cash -->
<div class="cash-display">
  <div class="cash-item">
    <span class="cash-icon">$</span>
    <div>
      <div class="cash-amount" id="cashAmount">$0</div>
      <div class="cash-label">Cash</div>
    </div>
  </div>
  <div class="cash-item bank">
    <span class="cash-icon">🏦</span>
    <div>
      <div class="cash-amount" id="bankAmount">$0</div>
      <div class="cash-label">Banca</div>
    </div>
  </div>
</div>

<!-- Vitals -->
<div class="vitals">
  <div class="speed-display" id="speedDisplay">
    <div class="speed-num" id="speedNum">0</div>
    <div class="speed-unit">KM/H</div>
  </div>
  <div class="bar-row bar-hp">
    <span class="bar-label">HP</span>
    <div class="bar-track"><div class="bar-fill" id="hpFill" style="width:100%"></div></div>
    <span class="bar-value" id="hpVal">100</span>
  </div>
  <div class="bar-row bar-armor">
    <span class="bar-label">AR</span>
    <div class="bar-track"><div class="bar-fill" id="arFill" style="width:0%"></div></div>
    <span class="bar-value" id="arVal">0</span>
  </div>
</div>

<!-- Notifications -->
<div class="notifications" id="notifContainer"></div>

<script>
  // ── Clock ──
  function updateClock() {
    const now = new Date();
    const h   = String(now.getHours()).padStart(2,'0');
    const m   = String(now.getMinutes()).padStart(2,'0');
    const d   = now.toLocaleDateString('ro-RO', {day:'2-digit',month:'short',year:'numeric'});
    document.getElementById('clockTime').textContent = `${h}:${m}`;
    document.getElementById('clockDate').textContent = d;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Stats update ──
  function updateStats(stats) {
    document.getElementById('playerName').textContent = stats.name  || '---';
    document.getElementById('playerCnp').textContent  = stats.cnp   || '---';
    document.getElementById('playerJob').textContent  = stats.job   || 'Somer';
    document.getElementById('levelNum').textContent   = stats.level || 1;
    document.getElementById('cashAmount').textContent = '$' + (stats.cash  || 0).toLocaleString();
    document.getElementById('bankAmount').textContent = '$' + (stats.bank  || 0).toLocaleString();

    const xpForNext = (stats.level || 1) * 500;
    const xpPct     = Math.min(100, ((stats.experience || 0) % xpForNext) / xpForNext * 100);
    document.getElementById('levelFill').style.width = xpPct + '%';
  }

  // ── Vitals update (called each frame) ──
  function updateVitals(hp, armor, speed, inVehicle) {
    document.getElementById('hpFill').style.width = Math.max(0, Math.min(100, hp)) + '%';
    document.getElementById('arFill').style.width = Math.max(0, Math.min(100, armor)) + '%';
    document.getElementById('hpVal').textContent  = Math.round(hp);
    document.getElementById('arVal').textContent  = Math.round(armor);

    const speedEl = document.getElementById('speedDisplay');
    speedEl.classList.toggle('visible', inVehicle);
    if (inVehicle) document.getElementById('speedNum').textContent = speed;
  }

  // ── Notifications ──
  const notifQueue = [];
  function showNotification(msg, type = 'info') {
    const cont = document.getElementById('notifContainer');
    const el   = document.createElement('div');
    el.className = `notif ${type}`;
    el.textContent = msg;
    cont.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 300);
    }, 4000);
  }

  function hideHud() {
    document.body.style.opacity = '0';
  }
</script>
</body>
</html>
