<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonSyndicate HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: #e0e0f0;
    pointer-events: none;
    user-select: none;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.025) 2px,
      rgba(0,0,0,0.025) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* TOP-LEFT */
  #top-left {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: slideInLeft 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  #logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #FF2D78;
    text-shadow: 0 0 8px #FF2D78, 0 0 24px rgba(255,45,120,0.55), 0 0 48px rgba(255,45,120,0.2);
    line-height: 1;
  }

  #cnp-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    color: #00D4FF;
    text-shadow: 0 0 6px rgba(0,212,255,0.7);
    opacity: 0.8;
    margin-top: -2px;
  }

  #player-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 6px 10px;
    background: rgba(8,8,24,0.88);
    border: 1px solid rgba(255,45,120,0.22);
    border-left: 2px solid #FF2D78;
    backdrop-filter: blur(8px);
  }

  #player-name {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
  }

  #player-job {
    font-size: 11px;
    font-weight: 600;
    color: #00D4FF;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* TOP-RIGHT: Clock */
  #top-right {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    padding: 8px 12px;
    background: rgba(8,8,24,0.88);
    border: 1px solid rgba(0,212,255,0.22);
    border-right: 2px solid #00D4FF;
    backdrop-filter: blur(8px);
    animation: slideInRight 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  #clock-time {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #00D4FF;
    text-shadow: 0 0 12px rgba(0,212,255,0.8), 0 0 32px rgba(0,212,255,0.3);
    letter-spacing: 2px;
    line-height: 1;
  }

  #clock-date {
    font-size: 10px;
    font-weight: 600;
    color: rgba(0,212,255,0.6);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* BOTTOM-LEFT: Money */
  #bottom-left {
    position: fixed;
    bottom: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    animation: slideInLeft 0.5s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  .money-card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    background: rgba(8,8,24,0.88);
    border: 1px solid rgba(255,45,120,0.2);
    backdrop-filter: blur(6px);
  }
  .money-card.bank { border-color: rgba(0,212,255,0.2); }

  .money-icon { font-size: 13px; }
  .money-label {
    font-size: 10px;
    font-weight: 600;
    color: rgba(224,224,240,0.45);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    min-width: 28px;
  }
  .money-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #FF2D78;
    text-shadow: 0 0 8px rgba(255,45,120,0.55);
    letter-spacing: 0.5px;
  }
  .money-card.bank .money-value {
    color: #00D4FF;
    text-shadow: 0 0 8px rgba(0,212,255,0.55);
  }

  /* BOTTOM-RIGHT */
  #bottom-right {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    animation: slideInRight 0.5s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  /* Speed */
  #speed-display {
    display: none;
    flex-direction: column;
    align-items: flex-end;
    padding: 6px 12px;
    background: rgba(8,8,24,0.88);
    border: 1px solid rgba(155,68,255,0.28);
    border-right: 2px solid #9B44FF;
    backdrop-filter: blur(6px);
  }
  #speed-display.visible { display: flex; }

  #speed-number {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    color: #9B44FF;
    text-shadow: 0 0 16px rgba(155,68,255,0.85), 0 0 48px rgba(155,68,255,0.3);
    line-height: 1;
    letter-spacing: -1px;
  }
  #speed-unit {
    font-size: 10px;
    font-weight: 700;
    color: rgba(155,68,255,0.65);
    letter-spacing: 3px;
    text-align: right;
  }

  /* Vitals row */
  #vitals-row {
    display: flex;
    flex-direction: row;
    gap: 5px;
    align-items: center;
  }

  .vital-ring {
    position: relative;
    width: 60px;
    height: 60px;
    display: none; /* shown via JS */
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .vital-ring svg {
    position: absolute;
    top: 0; left: 0;
    width: 60px; height: 60px;
    transform: rotate(-90deg);
  }
  .ring-bg  { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 3.5; }
  .ring-fill {
    fill: none;
    stroke-width: 3.5;
    stroke-linecap: butt;
    transition: stroke-dashoffset 0.4s ease;
    stroke-dasharray: 163.36;
    stroke-dashoffset: 0;
  }
  .vital-ring::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: rgba(8,8,24,0.82);
    z-index: 0;
  }
  .vital-icon  { font-size: 18px; z-index: 1; line-height: 1; }
  .vital-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    font-weight: 700;
    color: rgba(224,224,240,0.7);
    z-index: 1;
    margin-top: 1px;
  }

  .ring-hp    .ring-fill { stroke: #FF4466; }
  .ring-armor .ring-fill { stroke: #4488FF; }
  .ring-hunger .ring-fill{ stroke: #FF9944; }
  .ring-thirst .ring-fill{ stroke: #44CCFF; }
  .ring-stamina .ring-fill{ stroke: #00FF88; }
  .ring-stress .ring-fill { stroke: #FF6600; }

  /* CENTER-BOTTOM: Hint */
  #interaction-hint {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 22px;
    background: rgba(8,8,24,0.92);
    border: 1px solid rgba(0,255,136,0.35);
    border-bottom: 2px solid #00FF88;
    backdrop-filter: blur(8px);
  }
  #interaction-hint.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .hint-key {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: #00FF88;
    padding: 2px 8px;
    border: 1px solid rgba(0,255,136,0.5);
    text-shadow: 0 0 8px rgba(0,255,136,0.8);
    box-shadow: inset 0 0 8px rgba(0,255,136,0.15);
  }
  .hint-text { font-size: 14px; font-weight: 600; color: #e0e0f0; }
  .hint-poi  { color: #00FF88; font-weight: 700; text-shadow: 0 0 6px rgba(0,255,136,0.6); }

  /* CENTER-TOP: Notifications */
  #notifications {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 1000;
    pointer-events: none;
    min-width: 320px;
    max-width: 480px;
  }

  .notif {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(8,8,24,0.95);
    border-left: 3px solid;
    backdrop-filter: blur(8px);
    animation: notifIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
    position: relative;
    overflow: hidden;
  }
  .notif::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: currentColor;
    animation: notifTimer 4s linear forwards;
    transform-origin: left;
    opacity: 0.5;
  }
  .notif.success { border-color: #00FF88; color: #00FF88; }
  .notif.error   { border-color: #FF2D78; color: #FF2D78; }
  .notif.warning { border-color: #FFD700; color: #FFD700; }
  .notif.info    { border-color: #00D4FF; color: #00D4FF; }
  .notif-icon  { font-size: 15px; flex-shrink: 0; }
  .notif-msg   { font-size: 13px; font-weight: 600; color: #e0e0f0; flex: 1; }
  .notif.out   { animation: notifOut 0.3s ease forwards; }

  /* Animations */
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes notifIn {
    from { opacity: 0; transform: translateY(-16px) scaleY(0.85); }
    to   { opacity: 1; transform: translateY(0) scaleY(1); }
  }
  @keyframes notifOut {
    to { opacity: 0; transform: translateX(24px); max-height: 0; padding: 0; margin: 0; }
  }
  @keyframes notifTimer {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }

  body.hud-hidden #top-left,
  body.hud-hidden #top-right,
  body.hud-hidden #bottom-left,
  body.hud-hidden #bottom-right {
    opacity: 0;
    transition: opacity 0.5s ease;
  }
</style>
</head>
<body>

<!-- TOP-LEFT: Logo + CNP + Player Info -->
<div id="top-left">
  <div id="logo">NEON SYNDICATE</div>
  <div id="cnp-display">CNP: <span id="cnp-val">––––––––––</span></div>
  <div id="player-info">
    <div id="player-name">UNKNOWN</div>
    <div id="player-job">CIVILIAN</div>
  </div>
</div>

<!-- TOP-RIGHT: Clock -->
<div id="top-right">
  <div id="clock-time">00:00</div>
  <div id="clock-date">SAT, 01 JAN 2026</div>
</div>

<!-- BOTTOM-LEFT: Money -->
<div id="bottom-left">
  <div class="money-card">
    <span class="money-icon">💵</span>
    <span class="money-label">CASH</span>
    <span class="money-value" id="cash-val">$0</span>
  </div>
  <div class="money-card bank">
    <span class="money-icon">🏦</span>
    <span class="money-label">BANK</span>
    <span class="money-value" id="bank-val">$0</span>
  </div>
</div>

<!-- BOTTOM-RIGHT: Speed + Vitals -->
<div id="bottom-right">
  <div id="speed-display">
    <div id="speed-number">0</div>
    <div id="speed-unit">KM/H</div>
  </div>
  <div id="vitals-row">
    <div class="vital-ring ring-hp" id="ring-hp">
      <svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/><circle class="ring-fill" id="fill-hp" cx="30" cy="30" r="26"/></svg>
      <span class="vital-icon">❤️</span><span class="vital-value" id="val-hp">100</span>
    </div>
    <div class="vital-ring ring-armor" id="ring-armor">
      <svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/><circle class="ring-fill" id="fill-armor" cx="30" cy="30" r="26"/></svg>
      <span class="vital-icon">🛡️</span><span class="vital-value" id="val-armor">100</span>
    </div>
    <div class="vital-ring ring-hunger" id="ring-hunger">
      <svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/><circle class="ring-fill" id="fill-hunger" cx="30" cy="30" r="26"/></svg>
      <span class="vital-icon">🍔</span><span class="vital-value" id="val-hunger">100</span>
    </div>
    <div class="vital-ring ring-thirst" id="ring-thirst">
      <svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/><circle class="ring-fill" id="fill-thirst" cx="30" cy="30" r="26"/></svg>
      <span class="vital-icon">💧</span><span class="vital-value" id="val-thirst">100</span>
    </div>
    <div class="vital-ring ring-stamina" id="ring-stamina">
      <svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/><circle class="ring-fill" id="fill-stamina" cx="30" cy="30" r="26"/></svg>
      <span class="vital-icon">⚡</span><span class="vital-value" id="val-stamina">100</span>
    </div>
    <div class="vital-ring ring-stress" id="ring-stress">
      <svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/><circle class="ring-fill" id="fill-stress" cx="30" cy="30" r="26"/></svg>
      <span class="vital-icon">😤</span><span class="vital-value" id="val-stress">0</span>
    </div>
  </div>
</div>

<!-- CENTER-BOTTOM: Interaction Hint -->
<div id="interaction-hint">
  <span class="hint-key">[E]</span>
  <span class="hint-text">Apasa &nbsp;<span class="hint-poi" id="hint-poi-name">Interact</span></span>
</div>

<!-- CENTER-TOP: Notifications -->
<div id="notifications"></div>

<script>
  /* Circumference for r=26: 2 * PI * 26 = 163.36 */
  const CIRC = 163.36;

  /* ── Clock ── */
  function updateClock() {
    const now = new Date();
    const h   = String(now.getHours()).padStart(2,'0');
    const m   = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock-time').textContent = h + ':' + m;
    const days   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const day = days[now.getDay()];
    const mon = months[now.getMonth()];
    const d   = String(now.getDate()).padStart(2,'0');
    document.getElementById('clock-date').textContent =
      day + ', ' + d + ' ' + mon + ' ' + now.getFullYear();
  }
  updateClock();
  setInterval(updateClock, 10000);

  /* ── Ring helper ── */
  function setRing(fillId, pct) {
    const clamped = Math.max(0, Math.min(100, pct));
    document.getElementById(fillId).style.strokeDashoffset = CIRC - (clamped / 100) * CIRC;
  }
  function showRing(ringId, show) {
    document.getElementById(ringId).style.display = show ? 'flex' : 'none';
  }

  /* ── updateStats(stats) ── */
  function updateStats(stats) {
    if (stats.name  !== undefined) document.getElementById('player-name').textContent = stats.name;
    if (stats.cnp   !== undefined) document.getElementById('cnp-val').textContent    = stats.cnp;
    if (stats.job   !== undefined) document.getElementById('player-job').textContent  = stats.job;
    if (stats.cash  !== undefined) document.getElementById('cash-val').textContent   = '$' + Number(stats.cash).toLocaleString();
    if (stats.bank  !== undefined) document.getElementById('bank-val').textContent   = '$' + Number(stats.bank).toLocaleString();
  }

  /* ── updateVitals(hp, armor, speed, inVehicle) ── */
  function updateVitals(hp, armor, speed, inVehicle) {
    const speedEl = document.getElementById('speed-display');
    if (inVehicle) {
      speedEl.classList.add('visible');
      document.getElementById('speed-number').textContent = Math.round(speed);
    } else {
      speedEl.classList.remove('visible');
    }

    const hpPct    = Math.max(0, Math.min(100, hp));
    const armorPct = Math.max(0, Math.min(100, armor));

    const showHp    = hpPct    < 85;
    const showArmor = armorPct < 85;

    showRing('ring-hp',    showHp);
    showRing('ring-armor', showArmor);

    if (showHp) {
      setRing('fill-hp', hpPct);
      document.getElementById('val-hp').textContent = Math.round(hpPct);
    }
    if (showArmor) {
      setRing('fill-armor', armorPct);
      document.getElementById('val-armor').textContent = Math.round(armorPct);
    }
  }

  /* ── updateSurvival(stats) ── */
  function updateSurvival(stats) {
    const items = [
      { key:'hunger',  ringId:'ring-hunger',  fillId:'fill-hunger',  valId:'val-hunger',  thr:85, invert:false },
      { key:'thirst',  ringId:'ring-thirst',  fillId:'fill-thirst',  valId:'val-thirst',  thr:85, invert:false },
      { key:'stamina', ringId:'ring-stamina', fillId:'fill-stamina', valId:'val-stamina', thr:85, invert:false },
      { key:'stress',  ringId:'ring-stress',  fillId:'fill-stress',  valId:'val-stress',  thr:10, invert:true  },
    ];
    items.forEach(item => {
      if (stats[item.key] === undefined) return;
      const pct  = Math.max(0, Math.min(100, stats[item.key]));
      const show = item.invert ? pct > item.thr : pct < item.thr;
      showRing(item.ringId, show);
      if (show) {
        setRing(item.fillId, pct);
        document.getElementById(item.valId).textContent = Math.round(pct);
      }
    });
  }

  /* ── showNotification(msg, type) ── */
  const NOTIF_ICONS = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };

  function showNotification(msg, type) {
    type = type || 'info';
    const container = document.getElementById('notifications');
    const el = document.createElement('div');
    el.className = 'notif ' + type;
    el.innerHTML = `<span class="notif-icon">${NOTIF_ICONS[type]||'ℹ️'}</span>
                    <span class="notif-msg">${msg}</span>`;
    container.appendChild(el);

    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    }, 4000);
  }

  /* ── showHint / hideHint ── */
  function showHint(poiName) {
    document.getElementById('hint-poi-name').textContent = poiName || 'Interact';
    document.getElementById('interaction-hint').classList.add('visible');
  }
  function hideHint() {
    document.getElementById('interaction-hint').classList.remove('visible');
  }

  /* ── hideHud / showHud ── */
  function hideHud() { document.body.classList.add('hud-hidden'); }
  function showHud()  { document.body.classList.remove('hud-hidden'); }

  /* ── Ready ── */
  if (typeof mp !== 'undefined') mp.trigger('hud:ready');
</script>
</body>
</html>
